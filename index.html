<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XIUYI 首页实验</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bar: #2b221b; --bar-2: #3a2f26; --on-bar: #f3efe8; --on-bar-muted: #b8ab9a;
  --champagne: #b9a17b; --coffee: #5b4938; --paper: #e6e2db; --white: #fff; --ink: #2f251d; --muted: #6b5946;
  --line: rgba(243, 239, 232, .14);
  --serif: 'Noto Serif SC', 'Hiragino Mincho ProN', serif;
  --sans: 'Noto Sans SC', 'Hiragino Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bar); color: var(--on-bar); font: 14px/1.5 var(--sans); display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; }

.bar { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex: none; }
.brand { font-family: var(--serif); font-size: 15px; letter-spacing: .04em; white-space: nowrap; }
.brand b { font-weight: 600; letter-spacing: .14em; }
.brand span { color: var(--on-bar-muted); margin-left: 6px; font-size: 12px; }
.pills { display: flex; gap: 2px; overflow-x: auto; flex: 1; scrollbar-width: none; padding: 2px; }
.pills::-webkit-scrollbar { display: none; }
.pill { position: relative; min-width: 34px; height: 32px; padding: 0 6px; border-radius: 8px; color: var(--on-bar-muted); font-variant-numeric: tabular-nums; transition: background .15s, color .15s; }
.pill:hover { background: var(--bar-2); color: var(--on-bar); }
.pill[aria-current="true"] { background: var(--champagne); color: var(--bar); font-weight: 500; }
.pill.pending { opacity: .35; }
.pill .star { position: absolute; top: 1px; right: 3px; font-size: 9px; color: var(--champagne); }
.pill[aria-current="true"] .star { color: var(--bar); }
.tools { display: flex; gap: 6px; align-items: center; flex: none; }
.seg { display: flex; background: var(--bar-2); border-radius: 8px; padding: 2px; }
.seg button { height: 28px; padding: 0 10px; border-radius: 6px; color: var(--on-bar-muted); }
.seg button[aria-pressed="true"] { background: var(--on-bar); color: var(--bar); }
.btn { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); color: var(--on-bar); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.btn:hover { border-color: var(--champagne); }

.info { display: flex; gap: 20px; align-items: center; padding: 10px 16px 12px; border-bottom: 1px solid var(--line); flex: none; }
.info h1 { margin: 0; font: 600 18px/1.3 var(--serif); white-space: nowrap; }
.info h1 small { font: 400 12px var(--sans); color: var(--champagne); margin-left: 8px; letter-spacing: .04em; }
.info .txt { color: var(--on-bar-muted); font-size: 13px; flex: 1 1 260px; min-width: 0; }
.info .txt p { margin: 0; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.info.open .txt p { display: block; }
.more { color: var(--champagne); font-size: 12px; white-space: nowrap; padding: 0 4px; }
.info .txt em { font-style: normal; color: var(--on-bar); }
.info .tags { display: flex; gap: 6px; flex: 0 1 auto; min-width: 0; align-items: center; }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--on-bar-muted); white-space: nowrap; }
#vTech { max-width: 300px; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }

/* Bare preview: both bars collapse, a small pill keeps prev / next / restore. */
body.bare .bar, body.bare .info { display: none; }
.mini { position: fixed; left: 12px; bottom: 12px; z-index: 20; display: none; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(43, 34, 27, .78); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 8px 24px rgba(0, 0, 0, .25); opacity: .45; transition: opacity .2s; }
.mini:hover, .mini:focus-within { opacity: 1; }
body.bare .mini { display: flex; }
.mini button { height: 30px; min-width: 30px; padding: 0 10px; border-radius: 999px; color: var(--on-bar); font-size: 13px; }
.mini button:hover { background: rgba(243, 239, 232, .14); }
.mini .num { font-variant-numeric: tabular-nums; color: var(--champagne); min-width: 22px; text-align: center; font-size: 13px; }
.mini .show { border-left: 1px solid var(--line); border-radius: 0 999px 999px 0; margin-left: 4px; }
.tag.is3d { border-color: var(--champagne); color: var(--champagne); }
.fav { font-size: 13px; }
.fav[aria-pressed="true"] { background: var(--champagne); color: var(--bar); border-color: var(--champagne); }

.stage { flex: 1; position: relative; background: #1d1813; min-height: 0; }
.stage iframe { border: 0; background: var(--paper); display: block; }
.stage.desktop .phone, .stage.desktop iframe { width: 100%; height: 100%; }
.stage.mobile { display: grid; place-items: center; overflow: auto; padding: 16px; }
.stage.mobile .phone { width: 414px; height: 868px; border-radius: 44px; padding: 12px; background: #0d0b09; box-shadow: 0 0 0 1px #3a2f26, 0 30px 80px rgba(0,0,0,.5); transform-origin: center; }
.stage.mobile iframe { width: 390px; height: 844px; border-radius: 32px; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--on-bar-muted); font-family: var(--serif); font-size: 16px; text-align: center; padding: 24px; }

.grid { position: absolute; inset: 0; overflow: auto; padding: 24px 16px 48px; background: var(--bar); display: none; }
.stage.overview .grid { display: block; }
.stage.overview > :not(.grid) { display: none; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; max-width: 1680px; margin: 0 auto; }
.card { text-align: left; background: var(--bar-2); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--champagne); }
.card .thumb { aspect-ratio: 16 / 10; background: #1d1813 center top / cover no-repeat; display: grid; place-items: center; color: var(--on-bar-muted); font-size: 12px; }
.card .meta { padding: 10px 12px 12px; }
.card .meta b { font: 600 15px var(--serif); }
.card .meta .num { color: var(--champagne); font-variant-numeric: tabular-nums; margin-right: 8px; }
.card .meta p { margin: 4px 0 0; color: var(--on-bar-muted); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card .meta .starred { color: var(--champagne); }

@media (max-width: 900px) {
  .bar { flex-wrap: wrap; }
  .pills { order: 3; flex-basis: 100%; }
  .info { flex-wrap: wrap; gap: 6px 12px; }
  .info .txt { flex-basis: 100%; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><b>XIUYI</b> 首页 · 20 版<span title="← → 切换 · H 隐藏栏 · G 总览 · M 手机 · F 收藏 · I 说明">← → 切换 · H 隐藏栏</span></div>
  <nav class="pills" id="pills" aria-label="版本"></nav>
  <div class="tools">
    <button class="btn" id="overviewBtn" title="总览 (G)">总览</button>
    <div class="seg" role="group" aria-label="视口">
      <button id="deskBtn" aria-pressed="true" title="桌面 (M)">桌面</button>
      <button id="mobBtn" aria-pressed="false" title="手机 390 (M)">手机</button>
    </div>
    <a class="btn" id="openBtn" target="_blank" rel="noopener" title="在新标签页打开">新标签 ↗</a>
    <button class="btn" id="hideBtn" title="隐藏顶部栏 (H)">隐藏栏 ▴</button>
  </div>
</header>
<section class="info" id="info">
  <h1 id="vTitle"></h1>
  <div class="txt"><p id="vConcept"></p><p id="vFrom"></p></div>
  <div class="tags">
    <span class="tag" id="vTech"></span>
    <span class="tag is3d" id="v3d" hidden>3D</span>
    <a class="tag" id="vRepo" target="_blank" rel="noopener">仓库</a>
    <button class="more" id="moreBtn" aria-expanded="false" title="展开说明 (I)">展开说明</button>
    <button class="btn fav" id="favBtn" aria-pressed="false" title="收藏 (F)">☆ 收藏</button>
  </div>
</section>
<div class="mini" id="mini" role="toolbar" aria-label="预览控制">
  <button id="miniPrev" title="上一版 (←)" aria-label="上一版">‹</button>
  <span class="num" id="miniNum">01</span>
  <button id="miniNext" title="下一版 (→)" aria-label="下一版">›</button>
  <button class="show" id="showBtn" title="显示顶部栏 (H)">显示栏 ▾</button>
</div>
<main class="stage desktop" id="stage">
  <div class="phone" id="phone"><iframe id="frame" title="版本预览" allow="fullscreen; autoplay"></iframe></div>
  <div class="empty" id="empty" hidden></div>
  <div class="grid"><div class="cards" id="cards"></div></div>
</main>

<script src="manifest.js" onerror="window.LAB_VERSIONS = null"></script>
<script>
// Planned roster: shown when manifest.js is missing or a version has not finished.
const PLANNED = [
  ['v01-hallmark', 'hallmark'], ['v02-anthropic-skills', 'anthropic skills'], ['v03-impeccable', 'impeccable'],
  ['v04-open-design', 'open-design'], ['v05-huashu-design', 'huashu design'], ['v06-stitch-skills', 'stitch skills'],
  ['v07-nothing-design', 'nothing design'], ['v08-guizang-ppt', 'guizang ppt'], ['v09-logo-design', 'logo design'],
  ['v10-hyperframes', 'hyperframes'], ['v11-video-shotcraft', 'video-shotcraft'], ['v12-remotion', 'remotion skills'],
  ['v13-animated-shorts', 'animated shorts'], ['v14-blender', 'blender mcp'], ['v15-anatomy', 'anatomy'],
  ['v16-gamedev-skills', 'gamedev skills'], ['v17-gsap-skills', 'gsap skills'], ['v18-garden-skills', 'garden skills'],
  ['v19-pixelfx', 'pixelfx'], ['v20-oil-motion', 'oil-motion'],
];
const fromManifest = Array.isArray(window.LAB_VERSIONS) ? window.LAB_VERSIONS : [];
const V = PLANNED.map(([dir, tool]) => {
  const m = fromManifest.find((x) => x.dir.slice(0, 3) === dir.slice(0, 3));
  return m ? { ...m } : { dir, id: dir.slice(0, 3), tool, title: '', concept: '', fromTool: '', tech: '', is3d: false, ready: false, thumb: '' };
});
fromManifest.forEach((m) => { if (!V.some((v) => v.dir === m.dir)) V.push(m); });

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* private mode */ } },
};
let favs = new Set(store.get('xiuyi-lab-favs', []));
let idx = 0;
let mode = store.get('xiuyi-lab-mode', 'desktop');
let overview = false;

const $ = (id) => document.getElementById(id);
const stage = $('stage'), frame = $('frame');

function num(v) { return v.id.replace(/^v/, ''); }

function renderPills() {
  $('pills').innerHTML = V.map((v, i) => `<button class="pill${v.ready ? '' : ' pending'}" data-i="${i}" aria-current="${i === idx && !overview}" title="${num(v)} · ${v.tool}${v.title ? ' — ' + v.title : ''}">${num(v)}${favs.has(v.id) ? '<span class="star">★</span>' : ''}</button>`).join('');
}

function renderCards() {
  $('cards').innerHTML = V.map((v, i) => `
    <button class="card" data-i="${i}">
      <div class="thumb" style="${v.thumb ? `background-image:url('${v.thumb}')` : ''}">${v.thumb ? '' : (v.ready ? '无截图' : '未完成')}</div>
      <div class="meta">
        <div class="row"><b><span class="num">${num(v)}</span>${v.title || v.tool}</b>${favs.has(v.id) ? '<span class="starred">★</span>' : ''}</div>
        <p>${v.tool}${v.is3d ? ' · 3D' : ''} — ${v.concept || ''}</p>
      </div>
    </button>`).join('');
}

function show(i, push = true) {
  idx = (i + V.length) % V.length;
  overview = false;
  const v = V[idx];
  stage.classList.remove('overview');
  $('vTitle').innerHTML = `${num(v)} ${v.title || v.tool}<small>${v.tool}</small>`;
  $('vConcept').innerHTML = v.concept ? `<em>概念</em>　${v.concept}` : '';
  $('vFrom').innerHTML = v.fromTool ? `<em>取自工具</em>　${v.fromTool}` : '';
  $('vTech').textContent = v.tech || '—';
  $('v3d').hidden = !v.is3d;
  $('vRepo').href = v.repo || '#';
  $('vRepo').hidden = !v.repo;
  $('favBtn').setAttribute('aria-pressed', favs.has(v.id));
  $('favBtn').textContent = favs.has(v.id) ? '★ 已收藏' : '☆ 收藏';
  $('openBtn').href = `${v.dir}/index.html`;
  if (v.ready) {
    $('empty').hidden = true; $('phone').hidden = false;
    const src = `${v.dir}/index.html`;
    if (frame.getAttribute('src') !== src) frame.setAttribute('src', src);
  } else {
    $('phone').hidden = true; $('empty').hidden = false;
    $('empty').textContent = `${num(v)} · ${v.tool} 还没有完成`;
    frame.removeAttribute('src');
  }
  if (push) history.replaceState(null, '', `#${v.id}`);
  store.set('xiuyi-lab-last', v.id);
  renderPills();
  document.querySelector('.pill[aria-current="true"]')?.scrollIntoView({ block: 'nearest', inline: 'center' });
  $('miniNum').textContent = num(v);
  $('miniNum').title = v.title || v.tool;
  fitPhone();
}

function setBare(on) {
  document.body.classList.toggle('bare', on);
  store.set('xiuyi-lab-bare', on);
  fitPhone();
}

function setMode(m) {
  mode = m; store.set('xiuyi-lab-mode', m);
  stage.classList.toggle('desktop', m === 'desktop');
  stage.classList.toggle('mobile', m === 'mobile');
  $('deskBtn').setAttribute('aria-pressed', m === 'desktop');
  $('mobBtn').setAttribute('aria-pressed', m === 'mobile');
  fitPhone();
}

function fitPhone() {
  const phone = $('phone');
  if (mode !== 'mobile') { phone.style.transform = ''; return; }
  const s = Math.min(1, (stage.clientHeight - 32) / 868, (stage.clientWidth - 32) / 414);
  phone.style.transform = `scale(${s})`;
}

function toggleOverview() {
  overview = !overview;
  stage.classList.toggle('overview', overview);
  if (overview) { renderCards(); frame.removeAttribute('src'); renderPills(); }
  else show(idx);
}

function toggleFav() {
  const id = V[idx].id;
  favs.has(id) ? favs.delete(id) : favs.add(id);
  store.set('xiuyi-lab-favs', [...favs]);
  show(idx, false);
}

$('pills').addEventListener('click', (e) => { const b = e.target.closest('.pill'); if (b) show(+b.dataset.i); });
$('cards').addEventListener('click', (e) => { const b = e.target.closest('.card'); if (b) show(+b.dataset.i); });
$('overviewBtn').addEventListener('click', toggleOverview);
$('deskBtn').addEventListener('click', () => setMode('desktop'));
$('mobBtn').addEventListener('click', () => setMode('mobile'));
$('favBtn').addEventListener('click', toggleFav);
function toggleMore() {
  const open = !$('info').classList.contains('open');
  $('info').classList.toggle('open', open);
  $('moreBtn').setAttribute('aria-expanded', open);
  $('moreBtn').textContent = open ? '收起说明' : '展开说明';
  store.set('xiuyi-lab-more', open);
}
$('moreBtn').addEventListener('click', toggleMore);
if (store.get('xiuyi-lab-more', false)) toggleMore();
$('hideBtn').addEventListener('click', () => setBare(true));
$('showBtn').addEventListener('click', () => setBare(false));
$('miniPrev').addEventListener('click', () => show(idx - 1));
$('miniNext').addEventListener('click', () => show(idx + 1));
addEventListener('resize', fitPhone);
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'h' || e.key === 'H') setBare(!document.body.classList.contains('bare'));
  else if (e.key === 'Escape' && document.body.classList.contains('bare')) setBare(false);
  else if (e.key === 'ArrowRight') show(idx + 1);
  else if (e.key === 'ArrowLeft') show(idx - 1);
  else if (e.key === 'g' || e.key === 'G') toggleOverview();
  else if (e.key === 'm' || e.key === 'M') setMode(mode === 'desktop' ? 'mobile' : 'desktop');
  else if (e.key === 'f' || e.key === 'F') toggleFav();
  else if (e.key === 'i' || e.key === 'I') toggleMore();
});
// The frame steals keyboard focus after a click; pull it back so ← → keep working.
frame.addEventListener('load', () => { setTimeout(() => window.focus(), 50); });

const start = (location.hash || '').slice(1) || store.get('xiuyi-lab-last', 'v01');
setMode(mode);
show(Math.max(0, V.findIndex((v) => v.id === start)));
if (store.get('xiuyi-lab-bare', false)) setBare(true);
</script>
</body>
</html>
